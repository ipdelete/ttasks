[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ttasks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "github-copilot-sdk>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ttasks"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pdoc>=15.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--cov=ttasks",
    "--cov-report=term-missing",
    "-m", "not live",
]
markers = [
    "live: end-to-end tests that build real graphs and run a real TaskExecutor (deselected by default; run with `uv run pytest -m live`)",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.ty.environment]
python-version = "3.12"
